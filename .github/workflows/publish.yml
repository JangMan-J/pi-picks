# Checks every push and PR. On main, publishes package.json's version to npm
# when it is not there yet (npm trusted publishing, OIDC + provenance), then
# tags v<version> and creates a GitHub release from its CHANGELOG section.
# The npm trusted publisher must name this file: publish.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11

      - name: Decide what to release
        id: plan
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if ! versions=$(npm view "$name" versions --json 2>npm-err.txt); then
            if grep -q E404 npm-err.txt; then
              echo "::warning::$name is not on npm yet. Trusted publishing needs an existing package: publish the first version by hand, then run 'npm trust github --file publish.yml --repo $GITHUB_REPOSITORY --allow-publish'."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat npm-err.txt
            exit 1
          fi

          if node -e 'process.exit([].concat(JSON.parse(process.argv[1])).includes(process.argv[2]) ? 0 : 1)' "$versions" "$version"; then
            echo "::notice::$name@$version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.plan.outputs.publish == 'true'
        run: npm publish

      - name: Tag and create GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          awk -v h="## $VERSION" '
            index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
